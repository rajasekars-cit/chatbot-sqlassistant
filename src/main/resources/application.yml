spring:
  profiles:
    active: azure
  application:
    name: chatbot-sql-generator
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PWD}
  jpa:
    hibernate:
      ddl-auto: none #validate #update
logging:
    level:
        root: info  # Change to debug for development
        "[org.springframework]": warn  # Reduce Spring Boot logs
    file:
        name: ${LOG_PATH:logs}/chatbot-sql-generator.log
        max-size: 5MB  # Increased log file size
        total-size-cap: 50MB  # Increased total log size
        max-history: 30
        clean-history-on-start: false  # Prevent log loss on restart
    logback:
        rollingpolicy:
            file-name-pattern: ${LOG_PATH:logs}/chatbot-sql-generator-%d{yyyy-MM-dd}.%i.log